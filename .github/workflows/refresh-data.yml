name: Refresh data

# Daily, pull fresh data through every sensor, rescore, and redeploy the
# dashboard to gh-pages. The 17 MB SQLite corpus is not in git; it lives as a
# release asset (tag: data-snapshot) that this job restores at the start and
# re-uploads at the end, so the corpus grows across runs without bloating
# history. Code stays private; GitHub Pro serves Pages from the private repo.

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC daily (~03:00-04:00 US Pacific)
  workflow_dispatch: {}

permissions:
  contents: write # push gh-pages + manage the data-snapshot release asset

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PAGES_TOKEN: ${{ github.token }} # consumed by scripts/deploy_site.sh
      ECONSIGNALS_DB: ${{ github.workspace }}/data/econsignals.db
      ECONSIGNALS_NO_ZOTERO: "1" # no local Zotero on the runner
      OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ( cd webapp && npm ci )

      - name: Restore corpus from the data-snapshot release asset
        run: |
          mkdir -p data watches/papers
          # Distinguish "no release yet" (first run, fresh start is fine) from
          # "release exists but the download failed" (a network blip — abort, so
          # the persist step below can never clobber the stored corpus with an
          # empty/partial DB).
          if gh release view data-snapshot --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download data-snapshot --repo "$GITHUB_REPOSITORY" \
              --pattern econsignals.db --dir data --clobber \
              || { echo "::error::corpus asset exists but its download failed — aborting to protect the stored corpus"; exit 1; }
            gh release download data-snapshot --repo "$GITHUB_REPOSITORY" \
              --pattern state.json --dir watches/papers --clobber \
              || echo "::warning::state.json download failed; sensors will rebuild it"
            echo "RESTORED_DB_BYTES=$(stat -c%s data/econsignals.db)" >> "$GITHUB_ENV"
            echo "CORPUS_SAFE=1" >> "$GITHUB_ENV"
            echo "restored DB: $(du -h data/econsignals.db | cut -f1)"
          else
            echo "no data-snapshot release yet — first run, starting from an empty corpus"
            echo "RESTORED_DB_BYTES=0" >> "$GITHUB_ENV"
            echo "CORPUS_SAFE=1" >> "$GITHUB_ENV"
          fi

      - name: Scan sensors + rescore
        run: bash scripts/refresh_data.sh

      - name: Rebuild snapshot + deploy to gh-pages
        run: bash scripts/deploy_site.sh

      - name: Persist the updated corpus back to the release asset
        if: always()
        run: |
          # Never overwrite the stored corpus unless the restore completed safely
          # and the new DB is not smaller than what we restored (the corpus only
          # grows — papers are soft-deleted, never removed). These guards stop a
          # failed/partial run from clobbering months of accumulated data.
          if [ "${CORPUS_SAFE:-0}" != "1" ]; then
            echo "::warning::restore did not complete safely — NOT clobbering the stored corpus"; exit 0
          fi
          if [ ! -f data/econsignals.db ]; then
            echo "::warning::no DB file present — nothing to persist"; exit 0
          fi
          NEW_BYTES=$(stat -c%s data/econsignals.db)
          if [ "${RESTORED_DB_BYTES:-0}" -gt 0 ] && [ "$NEW_BYTES" -lt "$RESTORED_DB_BYTES" ]; then
            echo "::error::new DB ${NEW_BYTES}B < restored ${RESTORED_DB_BYTES}B — refusing to shrink the stored corpus"; exit 1
          fi
          gh release view data-snapshot --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create data-snapshot --repo "$GITHUB_REPOSITORY" \
                 --prerelease --title "Rolling data snapshot" \
                 --notes "CI corpus state (SQLite DB + sensor state). Auto-updated by refresh-data.yml; not a software release."
          gh release upload data-snapshot --repo "$GITHUB_REPOSITORY" \
            data/econsignals.db watches/papers/state.json --clobber
          echo "persisted DB: $(du -h data/econsignals.db | cut -f1) (restored was ${RESTORED_DB_BYTES}B)"
